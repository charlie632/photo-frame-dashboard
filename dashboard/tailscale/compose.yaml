# Serves the built dashboard as its own tailnet machine, "dashboard", from any Docker host.
# Setup on the host (once):
#   mkdir -p ~/home-dashboard && cd ~/home-dashboard
#   echo 'TS_AUTHKEY=tskey-auth-...' > .env && chmod 600 .env   # key tagged tag:dashboard
#   docker compose up -d
# Deploy new builds with `npm run deploy:tailscale` (copies dist/ here; no restart needed).
services:
  dashboard:
    image: tailscale/tailscale:stable
    hostname: dashboard
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - ./state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
      - ./dist:/srv/dashboard:ro
    restart: unless-stopped
